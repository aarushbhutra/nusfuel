<body class="bg-canvas text-on-surface min-h-screen flex justify-center selection:bg-surface-variant selection:text-on-surface">
<!-- Mobile Constraint Wrapper -->
<main class="w-full max-w-[390px] min-h-screen flex flex-col relative bg-canvas shadow-2xl shadow-on-surface/5 overflow-hidden">
<!-- Header -->
<header class="flex justify-between items-center px-gutter pt-8 pb-4 fade-in-up">
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">NUSFuel</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">FIELD NOTE 02 / 02</span>
</header>
<!-- Main Content -->
<article class="flex-1 px-gutter pt-xxl pb-8 flex flex-col">
<!-- Typography Section -->
<div class="mb-huge fade-in-up delay-100">
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm tracking-tight pr-4">
                    Your baseline is ready.
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant pr-8">
                    Based on your recent activity patterns, we've established a calm, sustainable foundation for your daily intake.
                </p>
</div>
<!-- Main Panel -->
<div class="bg-surface-raised rounded-2xl p-xl border border-border-soft/50 shadow-sm flex flex-col gap-xl fade-in-up delay-200">
<!-- Label -->
<div class="flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-primary block"></span>
<h2 class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Daily Target</h2>
</div>
<!-- Primary Metric -->
<div class="flex items-baseline gap-xs">
<span class="font-display-lg text-display-lg text-on-surface tracking-tighter">2,200</span>
<span class="font-body-md text-body-md text-on-surface-variant">kcal</span>
</div>
<div class="w-full h-px bg-border-soft opacity-40"></div>
<!-- Secondary Metric -->
<div class="flex items-baseline gap-xs">
<span class="font-display-md text-display-md text-on-surface tracking-tight">140</span>
<span class="font-body-md text-body-md text-on-surface-variant">g protein</span>
</div>
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Bottom Actions -->
<div class="flex flex-col gap-lg mt-huge fade-in-up delay-300">
<button class="w-full bg-primary text-on-primary py-[18px] rounded-2xl font-label-caps text-label-caps tracking-widest uppercase flex items-center justify-between px-xl transition-all active:scale-[0.985] active:opacity-80">
<span>Browse Techno Edge</span>
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
<button class="w-full py-sm font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase text-left pl-4 transition-opacity hover:opacity-70 active:opacity-50">
                    Edit target
                </button>
</div>
</article>
</main>
<script>
        // Micro-interaction for buttons (tactile feedback scale)
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.985)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
            // Touch support
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.985)';
            }, {passive: true});
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
