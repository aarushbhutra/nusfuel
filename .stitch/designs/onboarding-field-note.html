<style>
        /* Custom non-standard colors requested in prompt */
        .bg-warm-paper { background-color: #F5F0E8; }
        .text-olive-ink { color: #1F2521; }
        .bg-burnt-apricot { background-color: #D26A3A; }
        .text-burnt-apricot { color: #D26A3A; }
        .border-burnt-apricot { border-color: #D26A3A; }

            height: 1px;

    body {
      min-height: max(884px, 100dvh);

<body class="bg-warm-paper text-olive-ink min-h-screen flex flex-col antialiased">
<!-- Top Navigation / Header -->
<header class="flex justify-between items-center px-gutter pt-xl pb-md w-full sticky top-0 bg-warm-paper z-10">
<div class="font-display-md text-display-md font-bold tracking-tight">NUSFuel</div>
<div class="font-label-caps text-label-caps text-moss-grey tracking-widest uppercase">Field Note 01</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-gutter pt-xl pb-huge flex flex-col justify-start">
<!-- Hero Section -->
<section class="mb-xxl max-w-md">
<h1 class="font-display-lg text-display-lg mb-lg tracking-tight">Eat with a plan.</h1>
<p class="font-body-lg text-body-lg text-moss-grey mb-xl leading-relaxed">
                Set a daily target based on your needs. Then, find the right balance with a carefully selected meal from Techno Edge. Fueling your campus days intentionally.
            </p>
<!-- Asymmetrical Editorial Marker -->
<div class="flex items-center gap-md mt-lg">
<div class="w-3 h-3 rounded-full bg-burnt-apricot flex-shrink-0"></div>
<div class="editorial-rule w-16"></div>
</div>
</section>
<!-- Preview Panel (Porcelain Card) -->
<section class="bg-porcelain p-xl rounded-lg border border-border-soft mb-auto">
<h2 class="font-label-caps text-label-caps text-moss-grey mb-lg tracking-widest uppercase">Today's Starting Point</h2>
<div class="flex justify-between items-end mb-lg">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-moss-grey mb-xs">Energy</span>
<span class="font-number-data text-number-data">2,200 kcal</span>
</div>
<div class="flex flex-col text-right">
<span class="font-body-md text-body-md text-moss-grey mb-xs">Protein</span>
<span class="font-number-data text-number-data">140 g</span>
</div>
</div>
<!-- Progress Rule -->
<div class="w-full bg-surface-muted h-[2px] rounded-full overflow-hidden mt-md">
<div class="bg-burnt-apricot h-full w-[45%] rounded-full"></div>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="px-gutter pb-xl pt-lg bg-warm-paper w-full">
<button class="w-full h-[54px] bg-burnt-apricot text-[#FFF9F2] font-headline-sm text-headline-sm rounded-[18px] hover:opacity-90 active:scale-[0.985] transition-all flex items-center justify-center">
            Set my target
        </button>
<p class="text-center font-body-md text-sm text-moss-grey mt-md">
            Local preview session
        </p>
</footer>
<script>
        // Simple touch feedback for the button
        document.querySelector('button').addEventListener('touchstart', function() {
            this.style.transform = 'scale(0.985)';
            this.style.opacity = '0.82';
        });
        document.querySelector('button').addEventListener('touchend', function() {
            this.style.transform = 'scale(1)';
            this.style.opacity = '1';
        });
    </script>
